<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F2EEDF;--paper-2:#ECE6D2;--ink:#2A241B;--ink-soft:#5C5345;--pink:#E1A4C2;--lemon:#D6DD63;--blush:#E8C9B6;--sage:#B7C7A8;
    --serif:"Cormorant Garamond","Noto Serif SC",Georgia,serif;--sans:"Work Sans","PingFang SC","Microsoft YaHei",sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-weight:300;-webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}
  .sidebar{width:260px;flex-shrink:0;border-right:1px solid rgba(42,36,27,.15);padding:48px 32px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
  .brand{font-family:var(--serif);font-size:28px;font-weight:500;line-height:1}
  .brand small{display:block;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--ink-soft);margin-top:10px}
  .swatches{display:flex;gap:8px;margin-top:20px}
  .swatches i{width:18px;height:18px;border-radius:50%;display:block}
  .rule{height:1px;background:rgba(42,36,27,.2);margin:28px 0}
  .nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
  .nav a{padding:9px 0;color:var(--ink-soft);text-decoration:none;font-size:16px;cursor:pointer;border-bottom:1px solid transparent;transition:.2s;font-family:var(--serif)}
  .nav a:hover{color:var(--ink)}
  .nav a.active{color:var(--ink);border-bottom-color:var(--pink)}
  .review-btn{margin-top:24px;padding:13px 0;text-align:center;background:var(--lemon);color:var(--ink);text-decoration:none;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:500;transition:.25s}
  .review-btn:hover{background:var(--ink);color:var(--paper)}
  .content{flex:1;padding:72px 6vw;max-width:1180px;margin:0 auto;width:100%}
  .book-head{margin-bottom:56px}
  .book-head .author{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:18px}
  .book-head h1{font-family:var(--serif);font-size:52px;line-height:1.05;font-weight:500;letter-spacing:-.01em}
  .book-head .meta-line{height:3px;width:80px;background:var(--pink);margin-top:28px}
  .content h2{font-family:var(--serif);font-size:30px;font-weight:600;margin:56px 0 22px}
  .content p{font-size:16px;line-height:1.95;color:var(--ink);margin:18px 0}
  .content p:first-of-type::first-letter{font-family:var(--serif);font-size:68px;float:left;line-height:.85;padding:6px 12px 0 0;font-weight:500}
  .content ul{margin:18px 0;list-style:none}
  .content li{font-size:15px;line-height:1.9;color:var(--ink);padding:10px 0 10px 24px;position:relative;border-bottom:1px dashed rgba(42,36,27,.2)}
  .content li:before{content:"\2014";position:absolute;left:0;color:var(--pink)}
  .concept{background:rgba(255,255,255,.55);border-radius:18px;padding:0;margin:24px 0;cursor:pointer;transition:.2s;border:1px solid transparent}
  .concept:hover{border-color:rgba(42,36,27,.15)}
  .concept-head{padding:20px 28px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .concept-tag{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--ink-soft)}
  .concept h3{font-family:var(--serif);font-size:20px;font-weight:600;flex:1}
  .concept-reveal{font-size:11px;letter-spacing:1px;color:var(--pink);text-transform:uppercase}
  .concept-body{display:none;padding:0 28px 22px}
  .concept.open .concept-body{display:block}
  .concept.open .concept-reveal{color:var(--sage)}
  .concept-body p{margin:6px 0;font-size:15.5px;line-height:1.85}
  .callout{margin:48px 0;padding:40px;text-align:center}
  .callout-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--ink-soft)}
  .callout-summary p{font-family:var(--serif);font-size:22px;line-height:1.6;margin:18px 0 0;font-style:italic}
  .callout-quote{border-top:1px solid rgba(42,36,27,.2);border-bottom:1px solid rgba(42,36,27,.2)}
  .callout-quote .qmark{font-family:var(--serif);font-size:80px;line-height:.4;color:var(--blush);margin-bottom:18px}
  .callout-quote p{font-family:var(--serif);font-size:32px;line-height:1.35;font-weight:500;font-style:italic;margin:0}
  strong{font-weight:600}
  .quiz{margin:64px 0 0;padding:36px;background:var(--paper-2);border-radius:20px}
  .quiz-title{font-family:var(--serif);font-size:24px;font-weight:600;margin-bottom:6px}
  .quiz-sub{font-size:12px;color:var(--ink-soft);letter-spacing:1px;margin-bottom:24px}
  .quiz-q{margin-bottom:22px}
  .quiz-q .qq{font-family:var(--serif);font-size:18px;margin-bottom:12px}
  .quiz-opts{display:flex;flex-direction:column;gap:8px}
  .quiz-opt{padding:11px 16px;border:1px solid rgba(42,36,27,.2);border-radius:10px;cursor:pointer;font-size:14px;transition:.15s;background:transparent;text-align:left;color:var(--ink);font-family:var(--sans)}
  .quiz-opt:hover{border-color:var(--ink)}
  .quiz-opt.right{background:var(--sage);border-color:var(--sage)}
  .quiz-opt.wrong{background:var(--pink);border-color:var(--pink)}
  .quiz-opt:disabled{cursor:default;opacity:.85}
  .quiz-score{margin-top:18px;font-family:var(--serif);font-size:18px;color:var(--ink-soft)}
  .mini-quiz{margin:28px 0 8px;padding:20px 24px;background:rgba(255,255,255,.6);border-left:3px solid var(--lemon);border-radius:0 12px 12px 0}
  .mini-quiz-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
  .mini-quiz-q{font-family:var(--serif);font-size:17px;margin-bottom:12px;line-height:1.5}
  .mini-quiz-opts{display:flex;flex-direction:column;gap:6px}
  .mini-opt{padding:9px 14px;border:1px solid rgba(42,36,27,.18);border-radius:8px;cursor:pointer;font-size:13.5px;text-align:left;background:transparent;color:var(--ink);font-family:var(--sans);transition:.15s}
  .mini-opt:hover{border-color:var(--ink)}
  .mini-opt.right{background:var(--sage);border-color:var(--sage);color:var(--ink)}
  .mini-opt.wrong{background:var(--pink);border-color:var(--pink)}
  .mini-opt:disabled{cursor:default;opacity:.9}
  .mini-quiz-fb{margin-top:10px;font-size:13px;color:var(--ink-soft);font-style:italic}
  @media(max-width:760px){.sidebar{display:none}.content{padding:48px 24px}.book-head h1{font-size:36px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Reading Journal<small>笔记 · 读书笔记</small></div>
    <div class="swatches"><i style="background:var(--pink)"></i><i style="background:var(--lemon)"></i><i style="background:var(--blush)"></i></div>
    <div class="rule"></div>
    <nav class="nav" id="nav"></nav>
    <a class="review-btn" href="review.html">Review Cards</a>
  </aside>
  <main class="content" id="main"></main>
</div>
<script>
const BOOKS = [{"id": "critical-thinking", "title": "内驱式学习 · 明辨式思维", "author": "《内驱式学习》", "quiz_pool": [{"q": "什么是「论点」？", "a": "我的论点是什么？有清晰概念支撑吗？证据充分吗？我是在公正说理，还是在为自己立场辩护？有没有公正考虑过反方？"}, {"q": "人最常用的推论方式是什么？", "a": "类比——把不熟悉的情况与熟悉的比较来理解"}, {"q": "什么是「数据」？", "a": "是否搜集得足够详尽？这些证据能支撑这个结论，还是也能作别的解读？有没有未经证据支持的概念混进来？"}, {"q": "什么是「概念」？", "a": "我有没有拿日常口语词和直觉冒充概念？这个定义清晰吗？之前有没有遇到过相关类似问题？"}, {"q": "一个合理的论点应具备什么特征？", "a": "可溯源（证据）、可兼容（概念框架）、未来可调整完善"}, {"q": "明辨式思维的五步是哪五步？", "a": "界定问题→搜集信息→构建解释模型→用模型解释辨析→迭代更新"}, {"q": "什么是「问题」？", "a": "这个东西/概念究竟指什么？举实例"}, {"q": "什么是「第三步：构建解释模型」？", "a": "成瘾背后是\"黑化的学习\"——劫持多巴胺奖励机制，把高可塑的大脑变成贫瘠荒山"}], "quiz": [{"q": "什么是「论点」？", "a": "我的论点是什么？有清晰概念支撑吗？证据充分吗？我是在公正说理，还是在为自己立场辩护？有没有公正考虑过反方？"}, {"q": "人最常用的推论方式是什么？", "a": "类比——把不熟悉的情况与熟悉的比较来理解"}, {"q": "什么是「数据」？", "a": "是否搜集得足够详尽？这些证据能支撑这个结论，还是也能作别的解读？有没有未经证据支持的概念混进来？"}], "html": "<h1>明辨式思维（Critical Thinking）<\/h1>\n<div class=\"callout callout-summary\"><span class=\"callout-label\">精华<\/span><p>一句话精华 明辨式思维是收集、筛选、审视证据并合理推理，得出公正审慎判断的一套方法——像做科学研究一样思考。<\/p><\/div>\n<h2>为什么需要它<\/h2>\n<p>成百上千年尺度上，只有讲求客观的科学在不断进步，而玄学和主观经验无法走向真相。最著名的例子：洋地黄（地高辛）本是无数医生的&quot;毕生经验&quot;，直到 1999 年《美国心脏医学学会杂志》论文证明，患者血液中地高辛含量越高、死亡风险越高——无论权威多大、经验多少、多少病人说好，最可信的证据仍然是随机双盲对照试验。歌里唱：生活在经验里，直到大厦崩塌。<\/p>\n<p>明辨式思维就是：基于大量观察和数据，提取规律、构建解释世界的模型，再用新信息检验、修正模型。<\/p>\n<h2>五步工作流（以&quot;网络游戏是否成瘾&quot;为例）<\/h2>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>第一步：发现问题，用清晰概念界定问题<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>先问基本概念：什么是&quot;成瘾&quot;？玩手机和看短视频能像鸦片一样算成瘾吗？如果算，意味着产品被有意设计去劫持大脑，监护人就必须主动管理。消灭问题是心智的默认本能，要主动跳出来。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>第二步：主题研究，搜集信息<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>追问现象背后最深层的特征。成瘾标志：不顾负面后果仍继续；有耐受性、需不断加量。警惕&quot;原生家庭&quot;式解释——它虽减轻心理负担、却未必有大样本证据。同样地，学习不顺就归因基因、生活不顺就归因环境，两种相反说法共同点都是&quot;与当下的我无关&quot;，都是外控。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>第三步：构建解释模型<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>成瘾背后是&quot;黑化的学习&quot;——劫持多巴胺奖励机制，把高可塑的大脑变成贫瘠荒山。对比：职业电竞选手有控制有计划、有认知参与；成瘾者被快感回路控制，二者大脑变化不同。于是模型浮现：失控、强迫、失去可塑性、长期改变大脑结构。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>第四步：用模型解释现象，辨析观点<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>有了清晰模型，再看媒体报道就能形成自己的判断。你接收的信息常戴着各方利益的滤镜；对&quot;权威信息&quot;不加审视就照单全收，等于把人生选择权交给别人。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>第五步：更新与迭代模型<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>短短 50 年前&quot;文盲&quot;还指不识字的人；现在程序化信息搬运岗正被 AI 取代，没有跨学科知识、不能开拓前沿的人有沦为&quot;新型文盲&quot;的风险。知识海洋没有彼岸，自主理性能跨百年千年积累——康德说，启蒙不是让极少数人启发大多数人，而是让普通人有勇气运用自己的理性。<\/p>\n<\/div><\/div>\n<div class=\"mini-quiz\"><div class=\"mini-quiz-label\">本节小测 · 五步工作流（以&quot;网络游戏是否成瘾&quot;为例）<\/div><div class=\"mini-quiz-q\">什么是「第三步：构建解释模型」？<\/div><div class=\"mini-quiz-opts\" data-answer=\"成瘾背后是&quot;黑化的学习&quot;——劫持多巴胺奖励机制，把高可塑的大脑变成贫瘠荒山\" data-opts='[\"成瘾背后是\\\"黑化的学习\\\"——劫持多巴胺奖励机制，把高可塑的大脑变成贫瘠荒山\", \"什么是「穿插练习（interleaved practice）」？\", \"什么是「问题」？\", \"什么是「好反馈的闭环」？\"]'><button class=\"mini-opt\">成瘾背后是&quot;黑化的学习&quot;——劫持多巴胺奖励机制，把高可塑的大脑变成贫瘠荒山<\/button><button class=\"mini-opt\">什么是「穿插练习（interleaved practice）」？<\/button><button class=\"mini-opt\">什么是「问题」？<\/button><button class=\"mini-opt\">什么是「好反馈的闭环」？<\/button><\/div><div class=\"mini-quiz-fb\" style=\"display:none\"><\/div><\/div>\n<h2>论证八模块检查清单<\/h2>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>问题<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>这个东西/概念究竟指什么？举实例。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>概念<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>我有没有拿日常口语词和直觉冒充概念？这个定义清晰吗？之前有没有遇到过相关类似问题？<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>数据<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>是否搜集得足够详尽？这些证据能支撑这个结论，还是也能作别的解读？有没有未经证据支持的概念混进来？<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>论点<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>我的论点是什么？有清晰概念支撑吗？证据充分吗？我是在公正说理，还是在为自己立场辩护？有没有公正考虑过反方？<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>前提<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>立论里&quot;天经地义&quot;的前提，真的必然为真、有证据吗？<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>推论<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>数据是怎么推出结论的？同样的数据能否得出别的结论？有没有反例？人最常用的推论是<strong>类比<\/strong>——把不熟悉的与熟悉的比较。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>影响<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>这个论点若被接受，会有哪些影响（包括我不愿看到的）？<\/p>\n<\/div><\/div>\n<div class=\"callout callout-quote\"><span class=\"callout-label\">金句<\/span><div class=\"qmark\">&#8220;<\/div><p>无论权威大小、经验多少，最可信的证据仍然是随机双盲对照试验。<\/p><\/div>\n<ul>\n<li>问：明辨式思维的五步是哪五步？<\/li>\n<\/ul>\n<p>  答：界定问题→搜集信息→构建解释模型→用模型解释辨析→迭代更新。<\/p>\n<ul>\n<li>问：人最常用的推论方式是什么？<\/li>\n<\/ul>\n<p>  答：类比——把不熟悉的情况与熟悉的比较来理解。<\/p>\n<ul>\n<li>问：一个合理的论点应具备什么特征？<\/li>\n<\/ul>\n<p>  答：可溯源（证据）、可兼容（概念框架）、未来可调整完善。<\/p>\n<div class=\"mini-quiz\"><div class=\"mini-quiz-label\">本节小测 · 论证八模块检查清单<\/div><div class=\"mini-quiz-q\">一个合理的论点应具备什么特征？<\/div><div class=\"mini-quiz-opts\" data-answer=\"可溯源（证据）、可兼容（概念框架）、未来可调整完善\" data-opts='[\"什么是「峰终定律」？\", \"可溯源（证据）、可兼容（概念框架）、未来可调整完善\", \"什么是「Logos 逻辑」？\", \"锚定效应是什么？\"]'><button class=\"mini-opt\">什么是「峰终定律」？<\/button><button class=\"mini-opt\">可溯源（证据）、可兼容（概念框架）、未来可调整完善<\/button><button class=\"mini-opt\">什么是「Logos 逻辑」？<\/button><button class=\"mini-opt\">锚定效应是什么？<\/button><\/div><div class=\"mini-quiz-fb\" style=\"display:none\"><\/div><\/div>"}, {"id": "erikson", "title": "内驱式学习 · 埃里克森毕生发展", "author": "《内驱式学习》", "quiz_pool": [{"q": "什么是「青春期：混乱即机遇」？", "a": "虽然标签是\"叛逆\"\"危机\"\"不好管\"，但和婴儿期一样，不稳定和混乱恰恰标志着大脑发展的飞跃期和机会期"}, {"q": "什么是「老年期（65岁以上）：智慧」？", "a": "核心矛盾：**自我完整 vs. 绝望失落**"}, {"q": "成年早期（21-45）的核心矛盾是什么？", "a": "爱 vs. 孤独，对应自我力量是广义的爱"}, {"q": "什么是「成熟期（46～65岁）：关切」？", "a": "核心矛盾：**繁衍 vs. 停滞**"}, {"q": "成熟期（46-65）要发展的品质是什么？", "a": "关心——超越私人生活，对社会和更多人的命运产生广泛关切"}, {"q": "弗洛伊德说幸福的来源是什么？", "a": "爱与工作"}, {"q": "什么是「成年早期（21～45岁）：广义的爱」？", "a": "核心矛盾：**爱 vs. 孤独**"}], "quiz": [{"q": "什么是「青春期：混乱即机遇」？", "a": "虽然标签是\"叛逆\"\"危机\"\"不好管\"，但和婴儿期一样，不稳定和混乱恰恰标志着大脑发展的飞跃期和机会期"}, {"q": "什么是「老年期（65岁以上）：智慧」？", "a": "核心矛盾：**自我完整 vs. 绝望失落**"}, {"q": "成年早期（21-45）的核心矛盾是什么？", "a": "爱 vs. 孤独，对应自我力量是广义的爱"}], "html": "<h1>埃里克森：毕生发展八阶段（成年后四段）<\/h1>\n<div class=\"callout callout-summary\"><span class=\"callout-label\">精华<\/span><p>一句话精华 人生每个阶段都有一对核心矛盾，平衡好它，就长出对应的自我力量。<\/p><\/div>\n<p>埃里克森是最早提出毕生发展理论的心理学家，他用这套理论解决了自己青少年时期&quot;A我&quot;和&quot;B我&quot;的矛盾。<\/p>\n<h2>成年期的四个阶段<\/h2>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>成年早期（21～45岁）：广义的爱<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>核心矛盾：<strong>爱 vs. 孤独<\/strong>。自我力量是广义的爱，长出的品质是广义亲密关系。<\/p>\n<p>工作后进入真实世界：人际交往、工作、社会运转由一个个复杂系统嵌套成混沌现实。在这样的复杂系统中，人必须自己发现和界定问题、拿出创造性方案、按反馈不断调整——这才是真正自主学习的开始。弗洛伊德说：<strong>爱与工作<\/strong>。工作本应是幸福的源头，停止工作会离幸福更远。<\/p>\n<p>这一阶段的矛盾是：一方面不愿投入事业或感情、没力气为他人付出、不敢承担麻烦；另一方面又孤独、缺乏深爱和有意义的生活。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>成熟期（46～65岁）：关切<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>核心矛盾：<strong>繁衍 vs. 停滞<\/strong>。繁衍的冲动推动人超越私人生活和亲密关系，对社会和更多人的命运产生更广泛的关切，生命借此获得扩张的动力和意义——这就是&quot;关心&quot;的品质。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>老年期（65岁以上）：智慧<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>核心矛盾：<strong>自我完整 vs. 绝望失落<\/strong>。长出的品质是睿智，包括意义的创造与仁慈——一种对生命的积极关注和持续个人成长，即使面对死亡也保持成长。他带着突破自我围墙的爱，感到对人们的普遍共在与悲悯：不论何时何地的人，都参与同一个总体精神的创造。与这种满足感相比，青春逝去、岁月遗憾都不算什么。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>青春期：混乱即机遇<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>虽然标签是&quot;叛逆&quot;&quot;危机&quot;&quot;不好管&quot;，但和婴儿期一样，不稳定和混乱恰恰标志着大脑发展的飞跃期和机会期。生物层面，童年与青春期到青年期是大脑可塑性的两大机遇期；但生物基础并非一切，持续的经验（持续信息输入和使用）塑造力更大。<\/p>\n<\/div><\/div>\n<div class=\"callout callout-quote\"><span class=\"callout-label\">金句<\/span><div class=\"qmark\">&#8220;<\/div><p>这一生，不论结果，不论何时，他都在热爱着、奋进着。<\/p><\/div>\n<ul>\n<li>问：成年早期（21-45）的核心矛盾是什么？<\/li>\n<\/ul>\n<p>  答：爱 vs. 孤独，对应自我力量是广义的爱。<\/p>\n<ul>\n<li>问：成熟期（46-65）要发展的品质是什么？<\/li>\n<\/ul>\n<p>  答：关心——超越私人生活，对社会和更多人的命运产生广泛关切。<\/p>\n<ul>\n<li>问：弗洛伊德说幸福的来源是什么？<\/li>\n<\/ul>\n<p>  答：爱与工作。<\/p>\n<div class=\"mini-quiz\"><div class=\"mini-quiz-label\">本节小测 · 成年期的四个阶段<\/div><div class=\"mini-quiz-q\">什么是「青春期：混乱即机遇」？<\/div><div class=\"mini-quiz-opts\" data-answer=\"虽然标签是&quot;叛逆&quot;&quot;危机&quot;&quot;不好管&quot;，但和婴儿期一样，不稳定和混乱恰恰标志着大脑发展的飞跃期和机会期\" data-opts='[\"写作口语没有标准答案时，怎么获得有效反馈？\", \"金句出自《内驱式学习 · 主动参与、记忆与内驱》，原文是哪一句？\", \"执行注意力主要靠哪些脑区？\", \"虽然标签是\\\"叛逆\\\"\\\"危机\\\"\\\"不好管\\\"，但和婴儿期一样，不稳定和混乱恰恰标志着大脑发展的飞跃期和机会期\"]'><button class=\"mini-opt\">写作口语没有标准答案时，怎么获得有效反馈？<\/button><button class=\"mini-opt\">金句出自《内驱式学习 · 主动参与、记忆与内驱》，原文是哪一句？<\/button><button class=\"mini-opt\">执行注意力主要靠哪些脑区？<\/button><button class=\"mini-opt\">虽然标签是&quot;叛逆&quot;&quot;危机&quot;&quot;不好管&quot;，但和婴儿期一样，不稳定和混乱恰恰标志着大脑发展的飞跃期和机会期<\/button><\/div><div class=\"mini-quiz-fb\" style=\"display:none\"><\/div><\/div>"}, {"id": "learning-five-elements", "title": "内驱式学习 · 五元素总览与注意力", "author": "《内驱式学习》", "quiz_pool": [{"q": "什么是「方向性注意力」？", "a": "像夜晚行车的车前灯，能在一定范围内对特定事物保持追踪，把焦点从背景里捞出来"}, {"q": "执行注意力主要靠哪些脑区？", "a": "前扣带回和前额叶"}, {"q": "什么是「最近学习区」？", "a": "内容太简单会无聊，太难会恐慌；刚好跳一跳够得着的地方，学习效率最高"}, {"q": "什么是「执行注意力」？", "a": "负责注意力本身的管理和调控，主要脑区是前扣带回和前额叶"}, {"q": "为什么刷完短视频再看书会觉得智力下降？", "a": "过度刺激耗尽警觉性注意力的神经资源，皮质重组导致其他感官输入被忽略"}, {"q": "什么是「警觉性注意力」？", "a": "像瞬间爆闪的强光灯"}, {"q": "学习五元素是哪五个？", "a": "最近学习区、注意力、主动参与、有效练习、有效反馈"}], "quiz": [{"q": "什么是「方向性注意力」？", "a": "像夜晚行车的车前灯，能在一定范围内对特定事物保持追踪，把焦点从背景里捞出来"}, {"q": "执行注意力主要靠哪些脑区？", "a": "前扣带回和前额叶"}, {"q": "什么是「最近学习区」？", "a": "内容太简单会无聊，太难会恐慌；刚好跳一跳够得着的地方，学习效率最高"}], "html": "<h1>学习五元素：总览与注意力<\/h1>\n<div class=\"callout callout-summary\"><span class=\"callout-label\">精华<\/span><p>一句话精华 高效学习不是往脑子里塞东西，而是在&quot;最近学习区&quot;里，调动注意力、主动构建、有效练习并拿到有效反馈。<\/p><\/div>\n<h2>学习五元素<\/h2>\n<p>这本书把学习拆成五个环环相扣的元素：<\/p>\n<ul>\n<li><strong>一、最近学习区<\/strong>：内容不过难也不过易，介于舒适区与恐慌区之间（即维果茨基的最近发展区）。<\/li>\n<li><strong>二、注意力<\/strong>：学会调集和引导注意力——思考的水车要靠它推动。<\/li>\n<li><strong>三、主动参与<\/strong>：大脑不是等待塞满货物的仓库，要主动构建个人知识体系。<\/li>\n<li><strong>四、有效练习<\/strong>：用科学方法让练习事半功倍。<\/li>\n<li><strong>五、有效反馈<\/strong>：能追溯到知识点、可迭代改进的反馈。<\/li>\n<\/ul>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>最近学习区<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>内容太简单会无聊，太难会恐慌；刚好跳一跳够得着的地方，学习效率最高。对应到日常，就是别拿别人的进度横向比较，也别定超出当前能力的目标。<\/p>\n<\/div><\/div>\n<h2>注意力网络模型<\/h2>\n<p>该理论把注意力划分为三个功能性神经网络，像接力一样依次启动：<\/p>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>警觉性注意力<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>像瞬间爆闪的强光灯。爆闪瞬间释放大量神经递质——肾上腺素、去甲肾上腺素、乙酰胆碱。某刺激被过度关注时，感官输入的皮质会重组：神经资源被重新分配到对这个刺激的处理上，忽略其他相关输入。这就是为什么刷完短视频再看书，会明显觉得自己&quot;智力下降&quot;——不是真的变笨，是警觉性资源被耗尽了。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>方向性注意力<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>像夜晚行车的车前灯，能在一定范围内对特定事物保持追踪，把焦点从背景里捞出来。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>执行注意力<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>负责注意力本身的管理和调控，主要脑区是前扣带回和前额叶。语言的听说读写篇幅长、信息多，全靠它在较长时间内持续监控、不断形成预期、分析意义，才能把握对方的意思。<\/p>\n<\/div><\/div>\n<div class=\"callout callout-quote\"><span class=\"callout-label\">金句<\/span><div class=\"qmark\">&#8220;<\/div><p>注意力的关键，在于日常。<\/p><\/div>\n<div class=\"mini-quiz\"><div class=\"mini-quiz-label\">本节小测 · 注意力网络模型<\/div><div class=\"mini-quiz-q\">什么是「执行注意力」？<\/div><div class=\"mini-quiz-opts\" data-answer=\"负责注意力本身的管理和调控，主要脑区是前扣带回和前额叶\" data-opts='[\"什么是「提升记忆的四招」？\", \"负责注意力本身的管理和调控，主要脑区是前扣带回和前额叶\", \"…\", \"什么是「5W2H 与矛盾冲突」？\"]'><button class=\"mini-opt\">什么是「提升记忆的四招」？<\/button><button class=\"mini-opt\">负责注意力本身的管理和调控，主要脑区是前扣带回和前额叶<\/button><button class=\"mini-opt\">…<\/button><button class=\"mini-opt\">什么是「5W2H 与矛盾冲突」？<\/button><\/div><div class=\"mini-quiz-fb\" style=\"display:none\"><\/div><\/div>\n<h2>我的批注<\/h2>\n<p>三种注意力不是平行开关，而是&quot;先警觉点亮、再方向聚焦、最后执行调控&quot;的链条。短视频之所以害人，是因为它滥用了警觉性注意力，把神经资源一次性榨干，留给执行注意力的电量就没了。所以学习前先远离强刺激，让警觉系统复位。<\/p>\n<ul>\n<li>问：学习五元素是哪五个？<\/li>\n<\/ul>\n<p>  答：最近学习区、注意力、主动参与、有效练习、有效反馈。<\/p>\n<ul>\n<li>问：执行注意力主要靠哪些脑区？<\/li>\n<\/ul>\n<p>  答：前扣带回和前额叶。<\/p>\n<ul>\n<li>问：为什么刷完短视频再看书会觉得智力下降？<\/li>\n<\/ul>\n<p>  答：过度刺激耗尽警觉性注意力的神经资源，皮质重组导致其他感官输入被忽略。<\/p>"}, {"id": "memory-engagement", "title": "内驱式学习 · 主动参与、记忆与内驱", "author": "《内驱式学习》", "quiz_pool": [{"q": "什么是「自我效能」？", "a": "一个人在多大程度上相信自己的行为能带来预期结果——多大程度相信方向盘握在自己手里"}, {"q": "怎么把外控变成内控？", "a": "拆分最小可执行目标 + 持续记录，把偶然努力变成长期行为"}, {"q": "什么是「提升记忆的四招」？", "a": "1. **散点结网**：自己思考加工，把孤立知识点连成网络"}, {"q": "记忆质量取决于什么？", "a": "编码时对信息处理的深度，即赋予层级和意义"}, {"q": "什么是「三种长时记忆」？", "a": "- **情节记忆**：个人化的，像某年某月某天的脑内电影"}, {"q": "什么是「最小行动 + 持续记录」？", "a": "\"每天读书半小时\"\"每天解决 3 题\"这类小目标立刻带来反馈"}, {"q": "什么是「变\"你必须\"为\"我想要\"」？", "a": "英文 play 同时指演奏、打球、下棋、玩耍，核心都是\"自主操作\""}, {"q": "什么是「把\"做不到\"变成\"能做到\"」？", "a": "按最近学习区调整预期、定合理目标，避免横向比较和超出当前能力的目标"}], "quiz": [{"q": "什么是「自我效能」？", "a": "一个人在多大程度上相信自己的行为能带来预期结果——多大程度相信方向盘握在自己手里"}, {"q": "怎么把外控变成内控？", "a": "拆分最小可执行目标 + 持续记录，把偶然努力变成长期行为"}, {"q": "什么是「提升记忆的四招」？", "a": "1. **散点结网**：自己思考加工，把孤立知识点连成网络"}], "html": "<h1>主动参与、记忆与内驱<\/h1>\n<div class=\"callout callout-summary\"><span class=\"callout-label\">精华<\/span><p>一句话精华 记忆不是搬运，而是对信息做深度加工、结成网络；学习的魔法是积累，改变靠最小行动目标和&quot;我想要&quot;。<\/p><\/div>\n<h2>主动参与是学习的本质<\/h2>\n<p>大量实验支持：<strong>消极的有机体什么也学不到<\/strong>。求知与思考本应是人类的欲望，像饥饿感一样，希望把新发现赋予词汇的形体。当旁观者的时间越久，越感到自己和世界隔绝——学习就是打通个人与世界的关联。<\/p>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>消费主义如何偷走学习<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>当&quot;消费&quot;溢出经济活动、主导精神世界，就成了消费主义。读书变成购买（花钱买现成讲解）、做题变成购买（花钱让 APP 收集错题）、学英语变成购买（300 元 30 分钟外教）。凡是不可购买、不可横向比较之物，就不被看见——这正是教育军备竞赛的心理根源。<\/p>\n<\/div><\/div>\n<h2>被动记忆 vs 主动记忆<\/h2>\n<p>记忆不是存文件，而是对事物进行解读和重组——通过提取模式、构建意义关联，在脑子里重建知识表征。<\/p>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>三种长时记忆<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<ul>\n<li><strong>情节记忆<\/strong>：个人化的，像某年某月某天的脑内电影。<\/li>\n<li><strong>程序性记忆<\/strong>：存储在小脑，与感知运动相关，如骑车、游泳。<\/li>\n<li><strong>语义记忆<\/strong>：概念构成的知识体系，以及背后的原则和规则。<\/li>\n<\/ul>\n<p>小白与高手的差距，关键不仅在高级思维，更在记忆储备。如果记忆像把图书馆开成没有分类的废纸仓库——文件不停往里搬，从不思考分类、不搭意义网络——使用时就无法以最高效通路激活。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>编码深度决定记忆质量<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>&quot;那些我们不曾深入思考的东西，很快就会被忘却。&quot;记忆质量取决于编码时对信息处理的深度，即给初级记忆中的内容赋予层级和意义。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>提升记忆的四招<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>1. <strong>散点结网<\/strong>：自己思考加工，把孤立知识点连成网络。<\/p>\n<p>2. <strong>制造场景<\/strong>：把知识按场景主题组织（如单词按场景分类）。<\/p>\n<p>3. <strong>抽象视觉化<\/strong>：画树状图、包含关系图、时间轴，把抽象变画面。<\/p>\n<p>4. <strong>测试再现<\/strong>：学完立刻提取，极大帮助记忆。<\/p>\n<p>大脑最渴望的是意义与理解：把词句构建成连贯框架、放进完整画面，记忆就轻松准确。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>工作记忆靠积累提升<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>提升工作记忆的方法，就是增加该领域的知识体系。学得越多，孤立的点越能连成网，大脑运行越省力。<\/p>\n<\/div><\/div>\n<div class=\"callout callout-quote\"><span class=\"callout-label\">金句<\/span><div class=\"qmark\">&#8220;<\/div><p>如果你觉得某科又难又慢，先别说&quot;我天生不擅长&quot;，改为告诉自己：&quot;我的积累还不够。&quot;<\/p><\/div>\n<div class=\"mini-quiz\"><div class=\"mini-quiz-label\">本节小测 · 被动记忆 vs 主动记忆<\/div><div class=\"mini-quiz-q\">什么是「自我效能」？<\/div><div class=\"mini-quiz-opts\" data-answer=\"一个人在多大程度上相信自己的行为能带来预期结果——多大程度相信方向盘握在自己手里\" data-opts='[\"什么是「第一步：发现问题，用清晰概念界定问题」？\", \"什么是「变抽象为具体」？\", \"一个人在多大程度上相信自己的行为能带来预期结果——多大程度相信方向盘握在自己手里\", \"什么是「工作记忆靠积累提升」？\"]'><button class=\"mini-opt\">什么是「第一步：发现问题，用清晰概念界定问题」？<\/button><button class=\"mini-opt\">什么是「变抽象为具体」？<\/button><button class=\"mini-opt\">一个人在多大程度上相信自己的行为能带来预期结果——多大程度相信方向盘握在自己手里<\/button><button class=\"mini-opt\">什么是「工作记忆靠积累提升」？<\/button><\/div><div class=\"mini-quiz-fb\" style=\"display:none\"><\/div><\/div>\n<h2>内驱与如何改变<\/h2>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>自我效能<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>一个人在多大程度上相信自己的行为能带来预期结果——多大程度相信方向盘握在自己手里。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>把&quot;做不到&quot;变成&quot;能做到&quot;<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>按最近学习区调整预期、定合理目标，避免横向比较和超出当前能力的目标。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>最小行动 + 持续记录<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>&quot;每天读书半小时&quot;&quot;每天解决 3 题&quot;这类小目标立刻带来反馈。《贫穷的本质》指出穷人难走出贫穷陷阱，正是因为定不明确的理想目标、发现达不到就放弃、转而选眼前的&quot;情绪价值&quot;开支。记录能对抗&quot;一夜变好&quot;的冲动和&quot;一念放弃&quot;的冲动，把偶然努力变成长期行为，实现外控转内控。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>变&quot;你必须&quot;为&quot;我想要&quot;<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>英文 play 同时指演奏、打球、下棋、玩耍，核心都是&quot;自主操作&quot;。&quot;玩&quot;意味着沉浸其中、忍不住反复去做、根据反馈自主调整——在玩中完成大量非正式练习。这就是&quot;二分教、八分练&quot;。<\/p>\n<p>&gt; 大脑只占体重 2%，却消耗全身 20% 的能量。所以放学后先休息、吃饭、自由玩耍充电，学习时优先把最充沛的电量用在新知识点和最难的任务上。<\/p>\n<ul>\n<li>问：三种长时记忆分别是什么？<\/li>\n<\/ul>\n<p>  答：情节记忆（个人经历）、程序性记忆（小脑/运动技能）、语义记忆（概念与规则）。<\/p>\n<ul>\n<li>问：记忆质量取决于什么？<\/li>\n<\/ul>\n<p>  答：编码时对信息处理的深度，即赋予层级和意义。<\/p>\n<ul>\n<li>问：怎么把外控变成内控？<\/li>\n<\/ul>\n<p>  答：拆分最小可执行目标 + 持续记录，把偶然努力变成长期行为。<\/p>\n<\/div><\/div>\n<div class=\"mini-quiz\"><div class=\"mini-quiz-label\">本节小测 · 内驱与如何改变<\/div><div class=\"mini-quiz-q\">什么是「最小行动 + 持续记录」？<\/div><div class=\"mini-quiz-opts\" data-answer=\"&quot;每天读书半小时&quot;&quot;每天解决 3 题&quot;这类小目标立刻带来反馈\" data-opts='[\"什么是「峰终定律」？\", \"什么是「第一步：发现问题，用清晰概念界定问题」？\", \"\\\"每天读书半小时\\\"\\\"每天解决 3 题\\\"这类小目标立刻带来反馈\", \"什么是「提升记忆的四招」？\"]'><button class=\"mini-opt\">什么是「峰终定律」？<\/button><button class=\"mini-opt\">什么是「第一步：发现问题，用清晰概念界定问题」？<\/button><button class=\"mini-opt\">&quot;每天读书半小时&quot;&quot;每天解决 3 题&quot;这类小目标立刻带来反馈<\/button><button class=\"mini-opt\">什么是「提升记忆的四招」？<\/button><\/div><div class=\"mini-quiz-fb\" style=\"display:none\"><\/div><\/div>"}, {"id": "practice-and-feedback", "title": "内驱式学习 · 有效练习与有效反馈", "author": "《内驱式学习》", "quiz_pool": [{"q": "什么是「费曼技巧（精细复述）」？", "a": "费曼从小就有个习惯：不管别人告诉他什么现成定理，他都要用自己的话重新表述一遍，自己举实例检验是否符合定义，从而检验新知识"}, {"q": "什么是远迁移（far transfer）？", "a": "在与学习情境差异较大的多样场景下，能解决不同类型问题"}, {"q": "什么是「穿插练习（interleaved practice）」？", "a": "穿插前先要有\"可供穿插的单位\"——把复杂技能分解成更小块"}, {"q": "什么是「对比练习（对付无标准答案的输出）」？", "a": "写作、口语没有明确对错时，用对比制造反馈，效果甚至胜过一对一外教：\n- **口语**：朗读绘本时录音，跟绘本视频原声对比"}, {"q": "什么是「概念卡片」？", "a": "从百科、教材、专著、论文里摘出概念名词和定理做成卡片"}, {"q": "什么是「提取练习（主动提取）」？", "a": "标出几个关键词（重要概念），先自己讲：用了什么概念去解释问题、举了什么例子，然后对照原文查漏"}, {"q": "间隔重复为什么有助于巩固？", "a": "拉开间隔创造更多睡眠机会，而新知识的巩固必须通过睡眠"}, {"q": "什么是「两种学习之苦」？", "a": "学习之苦一分为二：其一是无效练习带来的**无意义感**，其二是无效反馈带来的**惩罚感**"}], "quiz": [{"q": "什么是「费曼技巧（精细复述）」？", "a": "费曼从小就有个习惯：不管别人告诉他什么现成定理，他都要用自己的话重新表述一遍，自己举实例检验是否符合定义，从而检验新知识"}, {"q": "什么是远迁移（far transfer）？", "a": "在与学习情境差异较大的多样场景下，能解决不同类型问题"}, {"q": "什么是「穿插练习（interleaved practice）」？", "a": "穿插前先要有\"可供穿插的单位\"——把复杂技能分解成更小块"}], "html": "<h1>有效练习与有效反馈<\/h1>\n<div class=\"callout callout-summary\"><span class=\"callout-label\">精华<\/span><p>一句话精华 练习要讲时机、换花样、打散间隔、主动提取；反馈要能追溯到知识点、让你反复改进直到掌握。<\/p><\/div>\n<h2>练习的时机与丰富模式<\/h2>\n<p>严肃训练阶段之前，一定要先铺垫兴趣引入；练习本身也要运用丰富模式。所谓丰富模式，不是抛开教材知识体系搞花样，而是利用多样素材、主动参与的实践来练习。只有在与学习情境差异较大的多样场景下，能解决不同类型问题，才算实现了<strong>远迁移<\/strong>（far transfer）。做法之一：针对同一个知识要点，看不同的人从不同角度如何界定、论证、举例。<\/p>\n<h2>有效练习的五种武器<\/h2>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>穿插练习（interleaved practice）<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>穿插前先要有&quot;可供穿插的单位&quot;——把复杂技能分解成更小块。然后把不同单位混在一起练。它逼大脑离开舒适区，对类似任务不断区分、回想各自要点，做更深的处理和比较，所以效果比集中练同一种好得多。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>分散练习与间隔重复<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>把练习拉开间隔，而不是一次塞满。第二个好处是：间隔创造了更多睡眠机会，而新知识的巩固必须通过睡眠完成。<\/p>\n<p>&gt; 我大二时不耐烦词汇量太小，决定背《牛津高阶》。把 1600 多页剪开，每 50 页订成一个小本，编号变成 30 多本——这就是把大任务拆成小单位、分散到日常的极端例子。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>提取练习（主动提取）<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>标出几个关键词（重要概念），先自己讲：用了什么概念去解释问题、举了什么例子，然后对照原文查漏。主动提取最典型、最有效的方式就是<strong>测试<\/strong>。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>费曼技巧（精细复述）<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>费曼从小就有个习惯：不管别人告诉他什么现成定理，他都要用自己的话重新表述一遍，自己举实例检验是否符合定义，从而检验新知识的合理性。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>概念卡片<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>从百科、教材、专著、论文里摘出概念名词和定理做成卡片。正面只有一个词（概念），背面才是定义、论证和举例，随时随地自测。<\/p>\n<\/div><\/div>\n<div class=\"mini-quiz\"><div class=\"mini-quiz-label\">本节小测 · 有效练习的五种武器<\/div><div class=\"mini-quiz-q\">什么是「概念卡片」？<\/div><div class=\"mini-quiz-opts\" data-answer=\"从百科、教材、专著、论文里摘出概念名词和定理做成卡片\" data-opts='[\"从百科、教材、专著、论文里摘出概念名词和定理做成卡片\", \"明辨式思维的五步是哪五步？\", \"什么是「前提」？\", \"什么是「成年早期（21～45岁）：广义的爱」？\"]'><button class=\"mini-opt\">从百科、教材、专著、论文里摘出概念名词和定理做成卡片<\/button><button class=\"mini-opt\">明辨式思维的五步是哪五步？<\/button><button class=\"mini-opt\">什么是「前提」？<\/button><button class=\"mini-opt\">什么是「成年早期（21～45岁）：广义的爱」？<\/button><\/div><div class=\"mini-quiz-fb\" style=\"display:none\"><\/div><\/div>\n<h2>有效反馈<\/h2>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>两种学习之苦<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>学习之苦一分为二：其一是无效练习带来的<strong>无意义感<\/strong>，其二是无效反馈带来的<strong>惩罚感<\/strong>。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>好反馈的闭环<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>做完题当场对答案 → 追溯到题目所属知识点 → 做针对性跟进练习 → 再测同类题 → 正确率上升 → 循环往复直到彻底掌握。关键是错题能挂到&quot;知识树&quot;上的具体节点，而不是对完答案就扔。可汗学院就是这个思路的样板。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>对比练习（对付无标准答案的输出）<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>写作、口语没有明确对错时，用对比制造反馈，效果甚至胜过一对一外教：<\/p>\n<ul>\n<li><strong>口语<\/strong>：朗读绘本时录音，跟绘本视频原声对比；<\/li>\n<li><strong>写作<\/strong>：读一篇文章先提炼纲要主旨，过一两天忘记原文语句后，对着大纲重写一篇，再和原文逐句对比。<\/li>\n<\/ul>\n<\/div><\/div>\n<div class=\"callout callout-quote\"><span class=\"callout-label\">金句<\/span><div class=\"qmark\">&#8220;<\/div><p>每当我们逼迫大脑多走一步、额外多付出一点努力时，就会带来额外的好处。<\/p><\/div>\n<ul>\n<li>问：什么是远迁移（far transfer）？<\/li>\n<\/ul>\n<p>  答：在与学习情境差异较大的多样场景下，能解决不同类型问题。<\/p>\n<ul>\n<li>问：间隔重复为什么有助于巩固？<\/li>\n<\/ul>\n<p>  答：拉开间隔创造更多睡眠机会，而新知识的巩固必须通过睡眠。<\/p>\n<ul>\n<li>问：写作口语没有标准答案时，怎么获得有效反馈？<\/li>\n<\/ul>\n<p>  答：用对比练习——录音跟原声比、对着大纲重写再跟原文比。<\/p>\n<div class=\"mini-quiz\"><div class=\"mini-quiz-label\">本节小测 · 有效反馈<\/div><div class=\"mini-quiz-q\">什么是远迁移（far transfer）？<\/div><div class=\"mini-quiz-opts\" data-answer=\"在与学习情境差异较大的多样场景下，能解决不同类型问题\" data-opts='[\"什么是「好反馈的闭环」？\", \"三种长时记忆分别是什么？\", \"什么是「自我效能」？\", \"在与学习情境差异较大的多样场景下，能解决不同类型问题\"]'><button class=\"mini-opt\">什么是「好反馈的闭环」？<\/button><button class=\"mini-opt\">三种长时记忆分别是什么？<\/button><button class=\"mini-opt\">什么是「自我效能」？<\/button><button class=\"mini-opt\">在与学习情境差异较大的多样场景下，能解决不同类型问题<\/button><\/div><div class=\"mini-quiz-fb\" style=\"display:none\"><\/div><\/div>"}, {"id": "rhetoric-writing", "title": "内驱式学习 · 写作与说服", "author": "《内驱式学习》", "quiz_pool": [{"q": "什么是「叙事三步」？", "a": "①头脑风暴：自由联想，把脑子里的事例全列出来、提炼关键词；②自由书写；③找到矛盾冲突、构建三级大纲——那条你倾诉欲最强、"}, {"q": "什么是「Logos 逻辑」？", "a": "逻辑是文章的主架构，主架构有缺陷就随时会塌"}, {"q": "什么是「Kairos 时机」？", "a": "判断受众的关切与困惑"}, {"q": "什么是「三级笔记法」？", "a": "几分钟划关键词答 what/how/why、列对立项、抓主旨（模式抓取）；再整理成三级笔记，拿着它就能复述原文；过几天对"}, {"q": "为什么反面论证通常比正面更有力？", "a": "人对\"得到\"不足为奇，对\"失去\"的痛苦反应强烈"}, {"q": "什么是「Ethos 信任」？", "a": "你是个怎样的人、能否被信任，是头等大事"}, {"q": "什么是「5W2H 与矛盾冲突」？", "a": "记叙少不了时间地点人物如何如何；但真正的主线是**矛盾冲突**（三级笔记的第二层概念框架），5W2H 只是服务于它的第三"}, {"q": "记叙文真正的主线是什么？", "a": "矛盾冲突；5W2H 只是服务于它的具体事例"}], "quiz": [{"q": "什么是「叙事三步」？", "a": "①头脑风暴：自由联想，把脑子里的事例全列出来、提炼关键词；②自由书写；③找到矛盾冲突、构建三级大纲——那条你倾诉欲最强、"}, {"q": "什么是「Logos 逻辑」？", "a": "逻辑是文章的主架构，主架构有缺陷就随时会塌"}, {"q": "什么是「Kairos 时机」？", "a": "判断受众的关切与困惑"}], "html": "<h1>写作与说服<\/h1>\n<div class=\"callout callout-summary\"><span class=\"callout-label\">精华<\/span><p>一句话精华 记叙文抓矛盾冲突，论说文靠证据与架构；说服 = 逻辑 + 情感 + 信任 + 时机。<\/p><\/div>\n<h2>修辞四要素（亚里士多德《修辞学》）<\/h2>\n<p>人们说服时借助三种力量，后人补上第四种时机：<\/p>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>Logos 逻辑<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>逻辑是文章的主架构，主架构有缺陷就随时会塌。归纳是从个别提炼一般，演绎是把一般应用到个别。写作前必列三层大纲：抽象主旨 → 概念框架 → 具体事例。从左到右、从抽象到具体排列。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>Pathos 情感<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>希腊文原义是&quot;痛苦和体验&quot;——借真实体验调动情感，让读者跨越身体时空与你共情。欲卖苦口良药，须先拨动心弦。往往从<strong>负面后果<\/strong>讲更有力：人对&quot;得到&quot;不足为奇，对&quot;失去&quot;的痛苦反应强烈。例如讲&quot;人人相互为战、生活孤独贫困卑污&quot;，读者自然身临其境。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>Ethos 信任<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>你是个怎样的人、能否被信任，是头等大事。证据分三类：引用、案例与数据、实验等硬核证据。读书不要只摘抄好词好句，更要留意作者的数据、案例、个人经历，学习他人如何观察思考。查理·芒格的习惯就是反复核对&quot;检查清单&quot;。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>Kairos 时机<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>判断受众的关切与困惑。制造时机三步：①拉注意力拉手 → ②颠覆其安稳世界观 → ③抛出你的看法。讲微积分时先说&quot;没有它就没有手机、计算机、微波炉、收音机电视&quot;，先营造迫切性。<\/p>\n<\/div><\/div>\n<div class=\"mini-quiz\"><div class=\"mini-quiz-label\">本节小测 · 修辞四要素（亚里士多德《修辞学》）<\/div><div class=\"mini-quiz-q\">什么是「5W2H 与矛盾冲突」？<\/div><div class=\"mini-quiz-opts\" data-answer=\"记叙少不了时间地点人物如何如何；但真正的主线是**矛盾冲突**（三级笔记的第二层概念框架），5W2H 只是服务于它的第三\" data-opts='[\"记叙少不了时间地点人物如何如何；但真正的主线是**矛盾冲突**（三级笔记的第二层概念框架），5W2H 只是服务于它的第三\", \"什么是「提升记忆的四招」？\", \"什么是「Logos 逻辑」？\", \"什么是「第一步：发现问题，用清晰概念界定问题」？\"]'><button class=\"mini-opt\">记叙少不了时间地点人物如何如何；但真正的主线是**矛盾冲突**（三级笔记的第二层概念框架），5W2H 只是服务于它的第三<\/button><button class=\"mini-opt\">什么是「提升记忆的四招」？<\/button><button class=\"mini-opt\">什么是「Logos 逻辑」？<\/button><button class=\"mini-opt\">什么是「第一步：发现问题，用清晰概念界定问题」？<\/button><\/div><div class=\"mini-quiz-fb\" style=\"display:none\"><\/div><\/div>\n<h2>记叙与描写<\/h2>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>5W2H 与矛盾冲突<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>记叙少不了时间地点人物如何如何；但真正的主线是<strong>矛盾冲突<\/strong>（三级笔记的第二层概念框架），5W2H 只是服务于它的第三层事例。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>三级笔记法<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>几分钟划关键词答 what/how/why、列对立项、抓主旨（模式抓取）；再整理成三级笔记，拿着它就能复述原文；过几天对着笔记仿写，再与原文逐句对比，才发现原文某些措辞的深韵。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>变抽象为具体<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>再抽象的原理也要用类比、隐喻、拟人，变触手可及；变静态为动态、变结论为问题、聚焦中心矛盾。老舍写&quot;当作家拿钢笔、当老师拿粉笔、自误误人、薪水&quot;，用的都是具体事物——抽象道理贫乏，真实体验长青。神与形相互充盈，缺一不可。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>叙事三步<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>①头脑风暴：自由联想，把脑子里的事例全列出来、提炼关键词；②自由书写；③找到矛盾冲突、构建三级大纲——那条你倾诉欲最强、事例最丰富、内在有冲突感的线索，就是箭靶。<\/p>\n<\/div><\/div>\n<div class=\"callout callout-quote\"><span class=\"callout-label\">金句<\/span><div class=\"qmark\">&#8220;<\/div><p>神与形应当相互充盈，缺一不可。<\/p><\/div>\n<ul>\n<li>问：说服的四要素是什么？<\/li>\n<\/ul>\n<p>  答：Ethos 信任、Logos 逻辑、Pathos 情感、Kairos 时机。<\/p>\n<ul>\n<li>问：记叙文真正的主线是什么？<\/li>\n<\/ul>\n<p>  答：矛盾冲突；5W2H 只是服务于它的具体事例。<\/p>\n<ul>\n<li>问：为什么反面论证通常比正面更有力？<\/li>\n<\/ul>\n<p>  答：人对&quot;得到&quot;不足为奇，对&quot;失去&quot;的痛苦反应强烈。<\/p>\n<div class=\"mini-quiz\"><div class=\"mini-quiz-label\">本节小测 · 记叙与描写<\/div><div class=\"mini-quiz-q\">什么是「Logos 逻辑」？<\/div><div class=\"mini-quiz-opts\" data-answer=\"逻辑是文章的主架构，主架构有缺陷就随时会塌\" data-opts='[\"什么是「数据」？\", \"什么是「分散练习与间隔重复」？\", \"什么是「叙事三步」？\", \"逻辑是文章的主架构，主架构有缺陷就随时会塌\"]'><button class=\"mini-opt\">什么是「数据」？<\/button><button class=\"mini-opt\">什么是「分散练习与间隔重复」？<\/button><button class=\"mini-opt\">什么是「叙事三步」？<\/button><button class=\"mini-opt\">逻辑是文章的主架构，主架构有缺陷就随时会塌<\/button><\/div><div class=\"mini-quiz-fb\" style=\"display:none\"><\/div><\/div>"}, {"id": "thinking-fast-and-slow", "title": "思考，快与慢", "author": "丹尼尔·卡尼曼", "quiz_pool": [{"q": "什么是「峰终定律」？", "a": "人对一段体验的记忆，主要由**高峰时刻**和**结尾**决定，而不是全程感受的平均值"}, {"q": "卡尼曼把大脑分成哪两个系统？", "a": "系统1（快/直觉）与系统2（慢/推理）"}, {"q": "什么是「可得性启发」？", "a": "越容易想起的例子，越被我们当成\"常见\"或\"重要\"——鲜活的画面会扭曲概率判断"}, {"q": "锚定效应是什么？", "a": "先出现的无关数字会污染后续判断"}, {"q": "什么是「锚定效应」？", "a": "先出现的数字会成为\"锚\"，哪怕它与问题毫无关系，也会把后续判断拉向它"}, {"q": "峰终定律指什么？", "a": "记忆由高峰和结尾决定，而非全程平均"}], "quiz": [{"q": "什么是「峰终定律」？", "a": "人对一段体验的记忆，主要由**高峰时刻**和**结尾**决定，而不是全程感受的平均值"}, {"q": "卡尼曼把大脑分成哪两个系统？", "a": "系统1（快/直觉）与系统2（慢/推理）"}, {"q": "什么是「可得性启发」？", "a": "越容易想起的例子，越被我们当成\"常见\"或\"重要\"——鲜活的画面会扭曲概率判断"}], "html": "<h1>思考，快与慢：读书笔记<\/h1>\n<div class=\"callout callout-summary\"><span class=\"callout-label\">精华<\/span><p>一句话精华 卡尼曼把大脑拆成&quot;快&quot;与&quot;慢&quot;两套系统，大多数决策失误，都源于该慢的时候让快系统偷懒。<\/p><\/div>\n<h2>核心论点<\/h2>\n<p>卡尼曼认为，人类大脑有两套运行机制：<\/p>\n<ul>\n<li><strong>系统 1（快）<\/strong>：自动、即时、不费力、靠直觉，也最容易被偏见劫持。<\/li>\n<li><strong>系统 2（慢）<\/strong>：需要主动调用注意力，费力，负责推理、计算与自我控制。<\/li>\n<\/ul>\n<p>问题在于：系统 1 是默认的&quot;省电模式&quot;，它会用经验法则快速给出答案，却常常在复杂判断里出错。<\/p>\n<div class=\"callout callout-quote\"><span class=\"callout-label\">金句<\/span><div class=\"qmark\">&#8220;<\/div><p>金句 我们对自己了解得越少，就越自信。<\/p><\/div>\n<h2>关键概念<\/h2>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>锚定效应<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>先出现的数字会成为&quot;锚&quot;，哪怕它与问题毫无关系，也会把后续判断拉向它。<\/p>\n<p>*（可挖空：先出现的数字会成为「锚」）*<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>峰终定律<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>人对一段体验的记忆，主要由<strong>高峰时刻<\/strong>和<strong>结尾<\/strong>决定，而不是全程感受的平均值。<\/p>\n<\/div><\/div>\n<div class=\"concept\" onclick=\"this.classList.toggle('open')\"><div class=\"concept-head\"><span class=\"concept-tag\">CONCEPT<\/span><h3>可得性启发<\/h3><span class=\"concept-reveal\">回忆 / 显示答案<\/span><\/div><div class=\"concept-body\">\n<p>越容易想起的例子，越被我们当成&quot;常见&quot;或&quot;重要&quot;——鲜活的画面会扭曲概率判断。<\/p>\n<\/div><\/div>\n<div class=\"mini-quiz\"><div class=\"mini-quiz-label\">本节小测 · 关键概念<\/div><div class=\"mini-quiz-q\">什么是「可得性启发」？<\/div><div class=\"mini-quiz-opts\" data-answer=\"越容易想起的例子，越被我们当成&quot;常见&quot;或&quot;重要&quot;——鲜活的画面会扭曲概率判断\" data-opts='[\"什么是「好反馈的闭环」？\", \"什么是「成熟期（46～65岁）：关切」？\", \"越容易想起的例子，越被我们当成\\\"常见\\\"或\\\"重要\\\"——鲜活的画面会扭曲概率判断\", \"什么是「数据」？\"]'><button class=\"mini-opt\">什么是「好反馈的闭环」？<\/button><button class=\"mini-opt\">什么是「成熟期（46～65岁）：关切」？<\/button><button class=\"mini-opt\">越容易想起的例子，越被我们当成&quot;常见&quot;或&quot;重要&quot;——鲜活的画面会扭曲概率判断<\/button><button class=\"mini-opt\">什么是「数据」？<\/button><\/div><div class=\"mini-quiz-fb\" style=\"display:none\"><\/div><\/div>\n<h2>我的批注<\/h2>\n<p>系统 1 不是 bug，而是进化出来的节能策略。真正要练的不是&quot;永远理性&quot;，而是<strong>识别什么时候该切到系统 2<\/strong>：决策金额大、后果不可逆、或有人在带节奏的时候。<\/p>\n<h2>可复习卡片（自动生成目标）<\/h2>\n<ul>\n<li>问：卡尼曼把大脑分成哪两个系统？答：系统1（快/直觉）与系统2（慢/推理）。<\/li>\n<li>问：锚定效应是什么？答：先出现的无关数字会污染后续判断。<\/li>\n<li>问：峰终定律指什么？答：记忆由高峰和结尾决定，而非全程平均。<\/li>\n<\/ul>"}];
const nav = document.getElementById("nav"), main = document.getElementById("main");
function show(id){
  const b = BOOKS.find(x=>x.id===id) || BOOKS[0];
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("active", a.dataset.id===b.id));
  main.innerHTML = `<div class="book-head"><div class="author">${b.author}</div><h1>${b.title}</h1><div class="meta-line"></div></div>` + b.html + quizHtml(b);
  window.scrollTo(0,0);
  bindQuiz(b);
  bindMiniQuiz();
}
function bindMiniQuiz(){
  document.querySelectorAll(".mini-quiz").forEach(mq=>{
    const ans = mq.querySelector(".mini-quiz-opts").dataset.answer;
    const fb = mq.querySelector(".mini-quiz-fb");
    mq.querySelectorAll(".mini-opt").forEach(btn=>{
      btn.onclick=()=>{
        mq.querySelectorAll(".mini-opt").forEach(x=>{x.disabled=true; if(x.textContent===ans) x.classList.add("right");});
        if(btn.textContent!==ans) btn.classList.add("wrong");
        fb.style.display="block";
        fb.textContent = btn.textContent===ans ? "✓ 答对了" : "✗ 正确答案：" + ans;
      };
    });
  });
}
function quizHtml(b){
  if(!b.quiz || !b.quiz.length) return "";
  return `<div class="quiz"><div class="quiz-title">小测一下</div><div class="quiz-sub">先别翻回去，凭印象选 —— 这才是真正的记忆</div>` +
    b.quiz.map((q,i)=>`<div class="quiz-q" data-i="${i}"><div class="qq">${i+1}. ${q.q}</div><div class="quiz-opts">` +
      q.opts.map(o=>`<button class="quiz-opt" data-a="${o===q.a}">${o}</button>`).join("") +
      `</div></div>`).join("") +
    `<div class="quiz-score" id="qs-${b.id}"></div></div>`;
}
function bindQuiz(b){
  document.querySelectorAll(".quiz-q").forEach(q=>{
    const ans = b.quiz[+q.dataset.i].a;
    q.querySelectorAll(".quiz-opt").forEach(btn=>{
      btn.onclick=()=>{
        q.querySelectorAll(".quiz-opt").forEach(x=>{x.disabled=true; if(x.dataset.a==="true") x.classList.add("right");});
        if(btn.dataset.a!=="true") btn.classList.add("wrong");
        const done=document.querySelectorAll(".quiz-q .quiz-opt.right").length;
        const all=document.querySelectorAll(".quiz-q").length;
        const el=document.getElementById("qs-"+b.id);
        if(done===all) el.textContent = all===3 ? "全对，这本书你吃透了 \u2726" : `答对 ${done} / ${all}`;
      };
    });
  });
}

  const a=document.createElement("a"); a.dataset.id=b.id; a.textContent=b.title; a.onclick=()=>show(b.id);
  nav.appendChild(a);
