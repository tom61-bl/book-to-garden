<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>读书笔记 · 复习卡</title>
<style>
  :root { --bg:#0f1117; --card:#1a1d27; --ink:#e8e8ea; --sub:#9aa0ae; --accent:#6ea8fe; --good:#34c98e; --hard:#e0a94a; --again:#e5616b; --easy:#7b97aa; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         background:radial-gradient(1200px 600px at 50% -10%, #1c2233, var(--bg)); color:var(--ink);
         min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 16px; }
  .top { width:100%; max-width:680px; display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .top h1 { font-size:16px; font-weight:600; }
  .top .meta { font-size:13px; color:var(--sub); }
  .deck { width:100%; max-width:680px; height:340px; perspective:1400px; cursor:pointer; }
  .flipper { position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.2,.7,.3,1); transform-style:preserve-3d; }
  .deck.flipped .flipper { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; backface-visibility:hidden; border-radius:20px; padding:36px;
          background:var(--card); border:1px solid #2a2e3d; box-shadow:0 20px 60px rgba(0,0,0,.45);
          display:flex; flex-direction:column; justify-content:center; }
  .face.back { transform:rotateY(180deg); }
  .tag { font-size:12px; color:var(--accent); letter-spacing:.5px; margin-bottom:14px; text-transform:uppercase; }
  .q { font-size:24px; line-height:1.5; font-weight:600; }
  .a { font-size:19px; line-height:1.7; color:var(--ink); }
  .src { margin-top:18px; font-size:13px; color:var(--sub); }
  .hint { margin-top:26px; font-size:12px; color:#5a6070; text-align:center; }
  .actions { width:100%; max-width:680px; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:22px; }
  button { border:none; border-radius:12px; padding:14px 8px; font-size:14px; font-weight:600; color:#fff; cursor:pointer;
           transition:transform .1s, filter .15s; }
  button:hover { filter:brightness(1.15); transform:translateY(-1px); }
  .again { background:var(--again); } .hard { background:var(--hard); }
  .good { background:var(--good); } .easy { background:var(--easy); }
  .actions button:disabled { opacity:.35; cursor:not-allowed; }
  .done { text-align:center; padding:60px 0; }
  .done .big { font-size:48px; margin-bottom:10px; }
  kbd { background:#2a2e3d; border-radius:4px; padding:1px 6px; font-size:11px; }
</style>
</head>
<body>
  <div class="top">
    <h1>读书笔记 · 复习</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="deck" id="deck">
    <div class="flipper">
      <div class="face front">
        <div class="tag" id="tag">问题</div>
        <div class="q" id="question"></div>
        <div class="hint">点击卡片或按 <kbd>空格</kbd> 翻面</div>
      </div>
      <div class="face back">
        <div class="tag">答案</div>
        <div class="a" id="answer"></div>
        <div class="src" id="source"></div>
      </div>
    </div>
  </div>
  <div class="actions" id="actions" style="visibility:hidden">
    <button class="again" data-g="0">再来一次<br><small>1</small></button>
    <button class="hard" data-g="3">困难<br><small>2</small></button>
    <button class="good" data-g="4">良好<br><small>3</small></button>
    <button class="easy" data-g="5">简单<br><small>4</small></button>
  </div>
<script>
const CARDS = {"deck": "读书笔记", "cards": [{"type": "qa", "front": "什么是「第一步：发现问题，用清晰概念界定问题」？", "back": "先问基本概念：什么是\"成瘾\"？玩手机和看短视频能像鸦片一样算成瘾吗？如果算，意味着产品被有意设计去劫持大脑，监护人就必须主动管理。消灭问题是心智的默认本能，要主动跳出来。", "source": "内驱式学习 · 明辨式思维", "id": "6fb3c230-c1d4-adbe-abad-222d0945f1e8"}, {"type": "qa", "front": "什么是「第二步：主题研究，搜集信息」？", "back": "追问现象背后最深层的特征。成瘾标志：不顾负面后果仍继续；有耐受性、需不断加量。警惕\"原生家庭\"式解释——它虽减轻心理负担、却未必有大样本证据。同样地，学习不顺就归因基因、生活不顺就归因环境，两种相反说法共同点都是\"与当下的我无关\"，都是外控。", "source": "内驱式学习 · 明辨式思维", "id": "3184dac9-7c8b-6310-a0db-32162793f975"}, {"type": "qa", "front": "什么是「第三步：构建解释模型」？", "back": "成瘾背后是\"黑化的学习\"——劫持多巴胺奖励机制，把高可塑的大脑变成贫瘠荒山。对比：职业电竞选手有控制有计划、有认知参与；成瘾者被快感回路控制，二者大脑变化不同。于是模型浮现：失控、强迫、失去可塑性、长期改变大脑结构。", "source": "内驱式学习 · 明辨式思维", "id": "e510890a-0c38-28d6-8383-01ff163d2642"}, {"type": "qa", "front": "什么是「第四步：用模型解释现象，辨析观点」？", "back": "有了清晰模型，再看媒体报道就能形成自己的判断。你接收的信息常戴着各方利益的滤镜；对\"权威信息\"不加审视就照单全收，等于把人生选择权交给别人。", "source": "内驱式学习 · 明辨式思维", "id": "72525725-b587-aae9-dfac-714a0a1d535e"}, {"type": "qa", "front": "什么是「第五步：更新与迭代模型」？", "back": "短短 50 年前\"文盲\"还指不识字的人；现在程序化信息搬运岗正被 AI 取代，没有跨学科知识、不能开拓前沿的人有沦为\"新型文盲\"的风险。知识海洋没有彼岸，自主理性能跨百年千年积累——康德说，启蒙不是让极少数人启发大多数人，而是让普通人有勇气运用自己的理性。", "source": "内驱式学习 · 明辨式思维", "id": "df0ebe50-f98d-1f28-04a3-94712a92426c"}, {"type": "qa", "front": "什么是「问题」？", "back": "这个东西/概念究竟指什么？举实例。", "source": "内驱式学习 · 明辨式思维", "id": "ebca8a43-685a-a0af-3099-74c9dcacdd12"}, {"type": "qa", "front": "什么是「概念」？", "back": "我有没有拿日常口语词和直觉冒充概念？这个定义清晰吗？之前有没有遇到过相关类似问题？", "source": "内驱式学习 · 明辨式思维", "id": "8043cf69-4753-e776-4093-2c3922deac6b"}, {"type": "qa", "front": "什么是「数据」？", "back": "是否搜集得足够详尽？这些证据能支撑这个结论，还是也能作别的解读？有没有未经证据支持的概念混进来？", "source": "内驱式学习 · 明辨式思维", "id": "cfd921bb-0f0a-4fa3-cffd-3c4a617d0adf"}, {"type": "qa", "front": "什么是「论点」？", "back": "我的论点是什么？有清晰概念支撑吗？证据充分吗？我是在公正说理，还是在为自己立场辩护？有没有公正考虑过反方？", "source": "内驱式学习 · 明辨式思维", "id": "3890cd8f-c7c4-77d6-c58a-4f1f8eacf73d"}, {"type": "qa", "front": "什么是「前提」？", "back": "立论里\"天经地义\"的前提，真的必然为真、有证据吗？", "source": "内驱式学习 · 明辨式思维", "id": "43d68515-9803-090e-6008-280bd8522637"}, {"type": "qa", "front": "什么是「推论」？", "back": "数据是怎么推出结论的？同样的数据能否得出别的结论？有没有反例？人最常用的推论是**类比**——把不熟悉的与熟悉的比较。", "source": "内驱式学习 · 明辨式思维", "id": "9594a0fd-5ede-09c7-a7ab-8f59b6a15ba6"}, {"type": "qa", "front": "什么是「影响」？", "back": "这个论点若被接受，会有哪些影响（包括我不愿看到的）？\n\n> [!quote]\n> 无论权威大小、经验多少，最可信的证据仍然是随机双盲对照试验。\n\n- 问：明辨式思维的五步是哪五步？\n  答：界定问题→搜集信息→构建解释模型→用模型解释辨析→迭代更新。\n- 问：人最常用的推论方式是什么？\n  答：类比——把不熟悉的情况与熟悉的比较来理解。\n- 问：一个合理的论点应具备什么特征？\n  答：可溯源（证据）、可兼容（概念框架）、未来可调整完善。", "source": "内驱式学习 · 明辨式思维", "id": "aea2296e-c264-52b9-a635-2baa52fde099"}, {"type": "qa", "front": "明辨式思维的五步是哪五步？", "back": "界定问题→搜集信息→构建解释模型→用模型解释辨析→迭代更新。", "source": "内驱式学习 · 明辨式思维", "id": "6fbc9fb2-6d77-7b65-724e-db309400d645"}, {"type": "qa", "front": "人最常用的推论方式是什么？", "back": "类比——把不熟悉的情况与熟悉的比较来理解。", "source": "内驱式学习 · 明辨式思维", "id": "5252b498-14e0-73ba-6721-fb86feeb1817"}, {"type": "qa", "front": "一个合理的论点应具备什么特征？", "back": "可溯源（证据）、可兼容（概念框架）、未来可调整完善。", "source": "内驱式学习 · 明辨式思维", "id": "102e04f8-ecaa-31c1-78b6-520e3a6e72e1"}, {"type": "quote", "front": "金句出自《内驱式学习 · 明辨式思维》，原文是哪一句？", "back": "无论权威大小、经验多少，最可信的证据仍然是随机双盲对照试验。", "source": "内驱式学习 · 明辨式思维", "id": "3b93224b-2b77-789f-919e-73042c4ad8a7"}, {"type": "qa", "front": "什么是「成年早期（21～45岁）：广义的爱」？", "back": "核心矛盾：**爱 vs. 孤独**。自我力量是广义的爱，长出的品质是广义亲密关系。\n工作后进入真实世界：人际交往、工作、社会运转由一个个复杂系统嵌套成混沌现实。在这样的复杂系统中，人必须自己发现和界定问题、拿出创造性方案、按反馈不断调整——这才是真正自主学习的开始。弗洛伊德说：**爱与工作**。工作本应是幸福的源头，停止工作会离幸福更远。\n这一阶段的矛盾是：一方面不愿投入事业或感情、没力气为他人付出、不敢承担麻烦；另一方面又孤独、缺乏深爱和有意义的生活。", "source": "内驱式学习 · 埃里克森毕生发展", "id": "fb12cc84-9bb0-9b66-c0c8-7e64742db2bc"}, {"type": "qa", "front": "什么是「成熟期（46～65岁）：关切」？", "back": "核心矛盾：**繁衍 vs. 停滞**。繁衍的冲动推动人超越私人生活和亲密关系，对社会和更多人的命运产生更广泛的关切，生命借此获得扩张的动力和意义——这就是\"关心\"的品质。", "source": "内驱式学习 · 埃里克森毕生发展", "id": "05de5448-c6e1-ce57-597f-ffbb9d6234e1"}, {"type": "qa", "front": "什么是「老年期（65岁以上）：智慧」？", "back": "核心矛盾：**自我完整 vs. 绝望失落**。长出的品质是睿智，包括意义的创造与仁慈——一种对生命的积极关注和持续个人成长，即使面对死亡也保持成长。他带着突破自我围墙的爱，感到对人们的普遍共在与悲悯：不论何时何地的人，都参与同一个总体精神的创造。与这种满足感相比，青春逝去、岁月遗憾都不算什么。", "source": "内驱式学习 · 埃里克森毕生发展", "id": "ec0cdda9-4f06-f514-2ec3-4ea5ec6526af"}, {"type": "qa", "front": "什么是「青春期：混乱即机遇」？", "back": "虽然标签是\"叛逆\"\"危机\"\"不好管\"，但和婴儿期一样，不稳定和混乱恰恰标志着大脑发展的飞跃期和机会期。生物层面，童年与青春期到青年期是大脑可塑性的两大机遇期；但生物基础并非一切，持续的经验（持续信息输入和使用）塑造力更大。\n\n> [!quote]\n> 这一生，不论结果，不论何时，他都在热爱着、奋进着。\n\n- 问：成年早期（21-45）的核心矛盾是什么？\n  答：爱 vs. 孤独，对应自我力量是广义的爱。\n- 问：成熟期（46-65）要发展的品质是什么？\n  答：关心——超越私人生活，对社会和更多人的命运产生广泛关切。\n- 问：弗洛伊德说幸福的来源是什么？\n  答：爱与工作。", "source": "内驱式学习 · 埃里克森毕生发展", "id": "47279176-5138-c0e6-8c6e-1a4fead4ff62"}, {"type": "qa", "front": "成年早期（21-45）的核心矛盾是什么？", "back": "爱 vs. 孤独，对应自我力量是广义的爱。", "source": "内驱式学习 · 埃里克森毕生发展", "id": "436b98f7-5a07-7c59-8266-220c0c56f7e2"}, {"type": "qa", "front": "成熟期（46-65）要发展的品质是什么？", "back": "关心——超越私人生活，对社会和更多人的命运产生广泛关切。", "source": "内驱式学习 · 埃里克森毕生发展", "id": "1c910265-ec5c-4157-eff1-dcaf6831b967"}, {"type": "qa", "front": "弗洛伊德说幸福的来源是什么？", "back": "爱与工作。", "source": "内驱式学习 · 埃里克森毕生发展", "id": "ff93b02e-fdb5-587e-7d91-b040814d78f2"}, {"type": "quote", "front": "金句出自《内驱式学习 · 埃里克森毕生发展》，原文是哪一句？", "back": "这一生，不论结果，不论何时，他都在热爱着、奋进着。", "source": "内驱式学习 · 埃里克森毕生发展", "id": "17dbc30f-ecc6-2782-0e25-7647e5b8708a"}, {"type": "qa", "front": "…", "back": "…` 标记重点，脚本会自动抽成卡片。", "source": "我的数字书房", "id": "9a6c78a0-438a-92c7-b19c-3d139ad9d884"}, {"type": "qa", "front": "什么是「最近学习区」？", "back": "内容太简单会无聊，太难会恐慌；刚好跳一跳够得着的地方，学习效率最高。对应到日常，就是别拿别人的进度横向比较，也别定超出当前能力的目标。", "source": "内驱式学习 · 五元素总览与注意力", "id": "14d08326-a666-b399-c6b8-680636f0ce08"}, {"type": "qa", "front": "什么是「警觉性注意力」？", "back": "像瞬间爆闪的强光灯。爆闪瞬间释放大量神经递质——肾上腺素、去甲肾上腺素、乙酰胆碱。某刺激被过度关注时，感官输入的皮质会重组：神经资源被重新分配到对这个刺激的处理上，忽略其他相关输入。这就是为什么刷完短视频再看书，会明显觉得自己\"智力下降\"——不是真的变笨，是警觉性资源被耗尽了。", "source": "内驱式学习 · 五元素总览与注意力", "id": "cdd57824-dcba-bad0-db17-619d496626c9"}, {"type": "qa", "front": "什么是「方向性注意力」？", "back": "像夜晚行车的车前灯，能在一定范围内对特定事物保持追踪，把焦点从背景里捞出来。", "source": "内驱式学习 · 五元素总览与注意力", "id": "8df34047-049b-9662-f35e-4391dab51576"}, {"type": "qa", "front": "什么是「执行注意力」？", "back": "负责注意力本身的管理和调控，主要脑区是前扣带回和前额叶。语言的听说读写篇幅长、信息多，全靠它在较长时间内持续监控、不断形成预期、分析意义，才能把握对方的意思。\n\n> [!quote]\n> 注意力的关键，在于日常。", "source": "内驱式学习 · 五元素总览与注意力", "id": "f2744170-0402-54a8-50d0-0994c6673bc7"}, {"type": "qa", "front": "学习五元素是哪五个？", "back": "最近学习区、注意力、主动参与、有效练习、有效反馈。", "source": "内驱式学习 · 五元素总览与注意力", "id": "1e25a418-002f-6ac9-5793-d9ea60180695"}, {"type": "qa", "front": "执行注意力主要靠哪些脑区？", "back": "前扣带回和前额叶。", "source": "内驱式学习 · 五元素总览与注意力", "id": "5fb747c4-585b-4370-8994-8be716c94d10"}, {"type": "qa", "front": "为什么刷完短视频再看书会觉得智力下降？", "back": "过度刺激耗尽警觉性注意力的神经资源，皮质重组导致其他感官输入被忽略。", "source": "内驱式学习 · 五元素总览与注意力", "id": "c954ea02-30f6-a634-81e5-5279cfc3b09e"}, {"type": "quote", "front": "金句出自《内驱式学习 · 五元素总览与注意力》，原文是哪一句？", "back": "注意力的关键，在于日常。", "source": "内驱式学习 · 五元素总览与注意力", "id": "b10cfe3f-e934-4e70-19a4-5530191f6f08"}, {"type": "qa", "front": "什么是「消费主义如何偷走学习」？", "back": "当\"消费\"溢出经济活动、主导精神世界，就成了消费主义。读书变成购买（花钱买现成讲解）、做题变成购买（花钱让 APP 收集错题）、学英语变成购买（300 元 30 分钟外教）。凡是不可购买、不可横向比较之物，就不被看见——这正是教育军备竞赛的心理根源。", "source": "内驱式学习 · 主动参与、记忆与内驱", "id": "5f4e2bbe-403d-2214-a452-e148f9b98d38"}, {"type": "qa", "front": "什么是「三种长时记忆」？", "back": "- **情节记忆**：个人化的，像某年某月某天的脑内电影。\n- **程序性记忆**：存储在小脑，与感知运动相关，如骑车、游泳。\n- **语义记忆**：概念构成的知识体系，以及背后的原则和规则。\n\n小白与高手的差距，关键不仅在高级思维，更在记忆储备。如果记忆像把图书馆开成没有分类的废纸仓库——文件不停往里搬，从不思考分类、不搭意义网络——使用时就无法以最高效通路激活。", "source": "内驱式学习 · 主动参与、记忆与内驱", "id": "d0f6d10b-44c9-86b5-3b33-358c0d94fba9"}, {"type": "qa", "front": "什么是「编码深度决定记忆质量」？", "back": "\"那些我们不曾深入思考的东西，很快就会被忘却。\"记忆质量取决于编码时对信息处理的深度，即给初级记忆中的内容赋予层级和意义。", "source": "内驱式学习 · 主动参与、记忆与内驱", "id": "cb0d2e86-d474-440f-ef10-62738290478b"}, {"type": "qa", "front": "什么是「提升记忆的四招」？", "back": "1. **散点结网**：自己思考加工，把孤立知识点连成网络。\n2. **制造场景**：把知识按场景主题组织（如单词按场景分类）。\n3. **抽象视觉化**：画树状图、包含关系图、时间轴，把抽象变画面。\n4. **测试再现**：学完立刻提取，极大帮助记忆。\n\n大脑最渴望的是意义与理解：把词句构建成连贯框架、放进完整画面，记忆就轻松准确。", "source": "内驱式学习 · 主动参与、记忆与内驱", "id": "0bb2c2a8-ba69-1fbb-92e1-c895842cd9a0"}, {"type": "qa", "front": "什么是「工作记忆靠积累提升」？", "back": "提升工作记忆的方法，就是增加该领域的知识体系。学得越多，孤立的点越能连成网，大脑运行越省力。\n\n> [!quote]\n> 如果你觉得某科又难又慢，先别说\"我天生不擅长\"，改为告诉自己：\"我的积累还不够。\"", "source": "内驱式学习 · 主动参与、记忆与内驱", "id": "99d17b8f-7833-42f5-74ec-a14832a9627b"}, {"type": "qa", "front": "什么是「自我效能」？", "back": "一个人在多大程度上相信自己的行为能带来预期结果——多大程度相信方向盘握在自己手里。", "source": "内驱式学习 · 主动参与、记忆与内驱", "id": "f7a7be66-d2b8-50fc-e467-e8133dbab679"}, {"type": "qa", "front": "什么是「把\"做不到\"变成\"能做到\"」？", "back": "按最近学习区调整预期、定合理目标，避免横向比较和超出当前能力的目标。", "source": "内驱式学习 · 主动参与、记忆与内驱", "id": "7ade20a0-0563-93d0-8ecc-fbbaa94c173e"}, {"type": "qa", "front": "什么是「最小行动 + 持续记录」？", "back": "\"每天读书半小时\"\"每天解决 3 题\"这类小目标立刻带来反馈。《贫穷的本质》指出穷人难走出贫穷陷阱，正是因为定不明确的理想目标、发现达不到就放弃、转而选眼前的\"情绪价值\"开支。记录能对抗\"一夜变好\"的冲动和\"一念放弃\"的冲动，把偶然努力变成长期行为，实现外控转内控。", "source": "内驱式学习 · 主动参与、记忆与内驱", "id": "67381abe-ad6a-9d4c-36c1-0a5a41bd8d70"}, {"type": "qa", "front": "什么是「变\"你必须\"为\"我想要\"」？", "back": "英文 play 同时指演奏、打球、下棋、玩耍，核心都是\"自主操作\"。\"玩\"意味着沉浸其中、忍不住反复去做、根据反馈自主调整——在玩中完成大量非正式练习。这就是\"二分教、八分练\"。\n\n> 大脑只占体重 2%，却消耗全身 20% 的能量。所以放学后先休息、吃饭、自由玩耍充电，学习时优先把最充沛的电量用在新知识点和最难的任务上。\n\n- 问：三种长时记忆分别是什么？\n  答：情节记忆（个人经历）、程序性记忆（小脑/运动技能）、语义记忆（概念与规则）。\n- 问：记忆质量取决于什么？\n  答：编码时对信息处理的深度，即赋予层级和意义。\n- 问：怎么把外控变成内控？\n  答：拆分最小可执行目标 + 持续记录，把偶然努力变成长期行为。", "source": "内驱式学习 · 主动参与、记忆与内驱", "id": "f1a9f69a-602c-28ed-c64e-afb6a2127f76"}, {"type": "qa", "front": "三种长时记忆分别是什么？", "back": "情节记忆（个人经历）、程序性记忆（小脑/运动技能）、语义记忆（概念与规则）。", "source": "内驱式学习 · 主动参与、记忆与内驱", "id": "f853b141-38cc-3eb7-1983-dc19682d0660"}, {"type": "qa", "front": "记忆质量取决于什么？", "back": "编码时对信息处理的深度，即赋予层级和意义。", "source": "内驱式学习 · 主动参与、记忆与内驱", "id": "4c7c2431-ee49-ce41-5159-c4ce67c331c3"}, {"type": "qa", "front": "怎么把外控变成内控？", "back": "拆分最小可执行目标 + 持续记录，把偶然努力变成长期行为。", "source": "内驱式学习 · 主动参与、记忆与内驱", "id": "d0ddc1b9-b582-3da5-575f-985a365d5592"}, {"type": "quote", "front": "金句出自《内驱式学习 · 主动参与、记忆与内驱》，原文是哪一句？", "back": "如果你觉得某科又难又慢，先别说\"我天生不擅长\"，改为告诉自己：\"我的积累还不够。\"", "source": "内驱式学习 · 主动参与、记忆与内驱", "id": "cbb265fe-ba03-8d1c-430b-d43372b4ec63"}, {"type": "qa", "front": "什么是「穿插练习（interleaved practice）」？", "back": "穿插前先要有\"可供穿插的单位\"——把复杂技能分解成更小块。然后把不同单位混在一起练。它逼大脑离开舒适区，对类似任务不断区分、回想各自要点，做更深的处理和比较，所以效果比集中练同一种好得多。", "source": "内驱式学习 · 有效练习与有效反馈", "id": "2ce7823b-d7ad-b409-b66e-7f3af7210555"}, {"type": "qa", "front": "什么是「分散练习与间隔重复」？", "back": "把练习拉开间隔，而不是一次塞满。第二个好处是：间隔创造了更多睡眠机会，而新知识的巩固必须通过睡眠完成。\n\n> 我大二时不耐烦词汇量太小，决定背《牛津高阶》。把 1600 多页剪开，每 50 页订成一个小本，编号变成 30 多本——这就是把大任务拆成小单位、分散到日常的极端例子。", "source": "内驱式学习 · 有效练习与有效反馈", "id": "5576b180-06f1-4e2b-9c15-4b54e9b0ee9b"}, {"type": "qa", "front": "什么是「提取练习（主动提取）」？", "back": "标出几个关键词（重要概念），先自己讲：用了什么概念去解释问题、举了什么例子，然后对照原文查漏。主动提取最典型、最有效的方式就是**测试**。", "source": "内驱式学习 · 有效练习与有效反馈", "id": "b11d286b-5bbc-63aa-59bb-8f5818295e6e"}, {"type": "qa", "front": "什么是「费曼技巧（精细复述）」？", "back": "费曼从小就有个习惯：不管别人告诉他什么现成定理，他都要用自己的话重新表述一遍，自己举实例检验是否符合定义，从而检验新知识的合理性。", "source": "内驱式学习 · 有效练习与有效反馈", "id": "12b23b5a-569a-6593-2c0d-88c98dfd007a"}, {"type": "qa", "front": "什么是「概念卡片」？", "back": "从百科、教材、专著、论文里摘出概念名词和定理做成卡片。正面只有一个词（概念），背面才是定义、论证和举例，随时随地自测。", "source": "内驱式学习 · 有效练习与有效反馈", "id": "91374852-1029-e5a4-4718-a276df5bdcd0"}, {"type": "qa", "front": "什么是「两种学习之苦」？", "back": "学习之苦一分为二：其一是无效练习带来的**无意义感**，其二是无效反馈带来的**惩罚感**。", "source": "内驱式学习 · 有效练习与有效反馈", "id": "b665062f-5239-3054-429e-3b04942a5b1f"}, {"type": "qa", "front": "什么是「好反馈的闭环」？", "back": "做完题当场对答案 → 追溯到题目所属知识点 → 做针对性跟进练习 → 再测同类题 → 正确率上升 → 循环往复直到彻底掌握。关键是错题能挂到\"知识树\"上的具体节点，而不是对完答案就扔。可汗学院就是这个思路的样板。", "source": "内驱式学习 · 有效练习与有效反馈", "id": "83aa967a-7045-da00-48ea-7182cb70aba9"}, {"type": "qa", "front": "什么是「对比练习（对付无标准答案的输出）」？", "back": "写作、口语没有明确对错时，用对比制造反馈，效果甚至胜过一对一外教：\n- **口语**：朗读绘本时录音，跟绘本视频原声对比；\n- **写作**：读一篇文章先提炼纲要主旨，过一两天忘记原文语句后，对着大纲重写一篇，再和原文逐句对比。\n\n> [!quote]\n> 每当我们逼迫大脑多走一步、额外多付出一点努力时，就会带来额外的好处。\n\n- 问：什么是远迁移（far transfer）？\n  答：在与学习情境差异较大的多样场景下，能解决不同类型问题。\n- 问：间隔重复为什么有助于巩固？\n  答：拉开间隔创造更多睡眠机会，而新知识的巩固必须通过睡眠。\n- 问：写作口语没有标准答案时，怎么获得有效反馈？\n  答：用对比练习——录音跟原声比、对着大纲重写再跟原文比。", "source": "内驱式学习 · 有效练习与有效反馈", "id": "78f489db-1cea-93a3-c20d-01620d204bec"}, {"type": "qa", "front": "什么是远迁移（far transfer）？", "back": "在与学习情境差异较大的多样场景下，能解决不同类型问题。", "source": "内驱式学习 · 有效练习与有效反馈", "id": "72b72b4f-7fc2-24f1-011a-294be45a5ee1"}, {"type": "qa", "front": "间隔重复为什么有助于巩固？", "back": "拉开间隔创造更多睡眠机会，而新知识的巩固必须通过睡眠。", "source": "内驱式学习 · 有效练习与有效反馈", "id": "d2417324-9201-2dff-6dd3-4dab7ddbff3c"}, {"type": "qa", "front": "写作口语没有标准答案时，怎么获得有效反馈？", "back": "用对比练习——录音跟原声比、对着大纲重写再跟原文比。", "source": "内驱式学习 · 有效练习与有效反馈", "id": "28bdadf6-0219-31c8-c8a1-d423e478513d"}, {"type": "quote", "front": "金句出自《内驱式学习 · 有效练习与有效反馈》，原文是哪一句？", "back": "每当我们逼迫大脑多走一步、额外多付出一点努力时，就会带来额外的好处。", "source": "内驱式学习 · 有效练习与有效反馈", "id": "69b51e01-55bd-7ca4-989b-fbdb92e1ddc2"}, {"type": "qa", "front": "什么是「Logos 逻辑」？", "back": "逻辑是文章的主架构，主架构有缺陷就随时会塌。归纳是从个别提炼一般，演绎是把一般应用到个别。写作前必列三层大纲：抽象主旨 → 概念框架 → 具体事例。从左到右、从抽象到具体排列。", "source": "内驱式学习 · 写作与说服", "id": "e4a8271d-d996-1efa-b84d-5ed4baf6b097"}, {"type": "qa", "front": "什么是「Pathos 情感」？", "back": "希腊文原义是\"痛苦和体验\"——借真实体验调动情感，让读者跨越身体时空与你共情。欲卖苦口良药，须先拨动心弦。往往从**负面后果**讲更有力：人对\"得到\"不足为奇，对\"失去\"的痛苦反应强烈。例如讲\"人人相互为战、生活孤独贫困卑污\"，读者自然身临其境。", "source": "内驱式学习 · 写作与说服", "id": "55c57f7c-f46a-6984-59c9-dcbc427c781c"}, {"type": "qa", "front": "什么是「Ethos 信任」？", "back": "你是个怎样的人、能否被信任，是头等大事。证据分三类：引用、案例与数据、实验等硬核证据。读书不要只摘抄好词好句，更要留意作者的数据、案例、个人经历，学习他人如何观察思考。查理·芒格的习惯就是反复核对\"检查清单\"。", "source": "内驱式学习 · 写作与说服", "id": "43fe8e98-bf42-6b14-0cd4-3cf43529f36a"}, {"type": "qa", "front": "什么是「Kairos 时机」？", "back": "判断受众的关切与困惑。制造时机三步：①拉注意力拉手 → ②颠覆其安稳世界观 → ③抛出你的看法。讲微积分时先说\"没有它就没有手机、计算机、微波炉、收音机电视\"，先营造迫切性。", "source": "内驱式学习 · 写作与说服", "id": "aafaa559-5536-031d-3468-a9683b1cc243"}, {"type": "qa", "front": "什么是「5W2H 与矛盾冲突」？", "back": "记叙少不了时间地点人物如何如何；但真正的主线是**矛盾冲突**（三级笔记的第二层概念框架），5W2H 只是服务于它的第三层事例。", "source": "内驱式学习 · 写作与说服", "id": "9e8b3672-2f62-34f4-9fb5-749d0f4cab41"}, {"type": "qa", "front": "什么是「三级笔记法」？", "back": "几分钟划关键词答 what/how/why、列对立项、抓主旨（模式抓取）；再整理成三级笔记，拿着它就能复述原文；过几天对着笔记仿写，再与原文逐句对比，才发现原文某些措辞的深韵。", "source": "内驱式学习 · 写作与说服", "id": "f3f05c8f-b9c2-e5f8-858c-919d975d4b1e"}, {"type": "qa", "front": "什么是「变抽象为具体」？", "back": "再抽象的原理也要用类比、隐喻、拟人，变触手可及；变静态为动态、变结论为问题、聚焦中心矛盾。老舍写\"当作家拿钢笔、当老师拿粉笔、自误误人、薪水\"，用的都是具体事物——抽象道理贫乏，真实体验长青。神与形相互充盈，缺一不可。", "source": "内驱式学习 · 写作与说服", "id": "b439a848-23ec-808f-8b5c-31b3560b16d7"}, {"type": "qa", "front": "什么是「叙事三步」？", "back": "①头脑风暴：自由联想，把脑子里的事例全列出来、提炼关键词；②自由书写；③找到矛盾冲突、构建三级大纲——那条你倾诉欲最强、事例最丰富、内在有冲突感的线索，就是箭靶。\n\n> [!quote]\n> 神与形应当相互充盈，缺一不可。\n\n- 问：说服的四要素是什么？\n  答：Ethos 信任、Logos 逻辑、Pathos 情感、Kairos 时机。\n- 问：记叙文真正的主线是什么？\n  答：矛盾冲突；5W2H 只是服务于它的具体事例。\n- 问：为什么反面论证通常比正面更有力？\n  答：人对\"得到\"不足为奇，对\"失去\"的痛苦反应强烈。", "source": "内驱式学习 · 写作与说服", "id": "a089c190-9065-8339-bee3-4b08ca34b8e9"}, {"type": "qa", "front": "说服的四要素是什么？", "back": "Ethos 信任、Logos 逻辑、Pathos 情感、Kairos 时机。", "source": "内驱式学习 · 写作与说服", "id": "64652822-d348-fd3e-9d5e-1736d0b036a8"}, {"type": "qa", "front": "记叙文真正的主线是什么？", "back": "矛盾冲突；5W2H 只是服务于它的具体事例。", "source": "内驱式学习 · 写作与说服", "id": "060ce993-2cc6-7f93-0201-03e9e517d85f"}, {"type": "qa", "front": "为什么反面论证通常比正面更有力？", "back": "人对\"得到\"不足为奇，对\"失去\"的痛苦反应强烈。", "source": "内驱式学习 · 写作与说服", "id": "eb2c9af9-1046-435a-1873-3b04b19e38fe"}, {"type": "quote", "front": "金句出自《内驱式学习 · 写作与说服》，原文是哪一句？", "back": "神与形应当相互充盈，缺一不可。", "source": "内驱式学习 · 写作与说服", "id": "9b5d6669-d6a1-e7f8-052b-93e206fc70a2"}, {"type": "qa", "front": "什么是「锚定效应」？", "back": "先出现的数字会成为\"锚\"，哪怕它与问题毫无关系，也会把后续判断拉向它。", "source": "思考，快与慢", "id": "d59b2c67-4e38-babf-f94d-15c4d6b2cfbe"}, {"type": "qa", "front": "什么是「峰终定律」？", "back": "人对一段体验的记忆，主要由**高峰时刻**和**结尾**决定，而不是全程感受的平均值。", "source": "思考，快与慢", "id": "1223e75c-6c37-d77b-f818-0a06122d639a"}, {"type": "qa", "front": "什么是「可得性启发」？", "back": "越容易想起的例子，越被我们当成\"常见\"或\"重要\"——鲜活的画面会扭曲概率判断。", "source": "思考，快与慢", "id": "79e0b465-1cc8-ba6f-00ea-9cda62968bbf"}, {"type": "qa", "front": "卡尼曼把大脑分成哪两个系统？", "back": "系统1（快/直觉）与系统2（慢/推理）。", "source": "思考，快与慢", "id": "09c35912-804c-ddc5-d688-9b0fde3fb87b"}, {"type": "qa", "front": "锚定效应是什么？", "back": "先出现的无关数字会污染后续判断。", "source": "思考，快与慢", "id": "beefacad-7a36-5917-d9c4-0fb9d9b226d0"}, {"type": "qa", "front": "峰终定律指什么？", "back": "记忆由高峰和结尾决定，而非全程平均。", "source": "思考，快与慢", "id": "e4f41edb-a8f6-f4ee-c1cd-20790bb1a39d"}, {"type": "quote", "front": "金句出自《思考，快与慢》，原文是哪一句？", "back": "我们对自己了解得越少，就越自信。", "source": "思考，快与慢", "id": "774275e4-3d29-5dff-59cd-73a5fc597608"}]};
const KEY = "review_srs_state_v1";
let state = JSON.parse(localStorage.getItem(KEY) || "{}");
let queue = [], idx = 0;

function today(){ return Math.floor(Date.now()/86400000); }
function getSRS(c){ return state[c.id] || {due: today(), ivl:0, reps:0, ease:2.5}; }

function buildQueue(){
  const t = today();
  queue = CARDS.cards.filter(c => getSRS(c).due <= t)
                     .sort((a,b)=> getSRS(a).due - getSRS(b).due);
  idx = 0;
  render();
}
function render(){
  const meta = document.getElementById("meta");
  const deck = document.getElementById("deck");
  const actions = document.getElementById("actions");
  if (idx >= queue.length){
    deck.innerHTML = '<div class="done"><div class="big">🌱</div><div style="font-size:20px;font-weight:600">今日复习完成</div><div class="hint" style="margin-top:10px">明天再来，或按 <kbd>R</kbd> 重学全部</div></div>';
    actions.style.visibility = "hidden";
    meta.textContent = "完成";
    return;
  }
  const c = queue[idx];
  deck.classList.remove("flipped");
  document.getElementById("tag").textContent = c.type === "quote" ? "金句" : "概念";
  document.getElementById("question").textContent = c.front;
  document.getElementById("answer").textContent = c.back;
  document.getElementById("source").textContent = "来源：《" + c.source + "》";
  meta.textContent = (idx+1) + " / " + queue.length + " · 今日剩余";
  setTimeout(()=>{ actions.style.visibility="visible"; }, 500);
}
function grade(g){
  const c = queue[idx], s = getSRS(c);
  if (g === 0){ s.ivl = 0; s.reps = 0; s.ease = Math.max(1.3, s.ease - 0.2); }
  else {
    s.reps += 1;
    if (g === 3){ s.ease -= 0.15; s.ivl = Math.max(1, Math.round(s.ivl * 1.2)); }
    else if (g === 4){ s.ivl = s.ivl <= 0 ? 1 : (s.ivl === 1 ? 3 : Math.round(s.ivl * s.ease)); }
    else if (g === 5){ s.ivl = s.ivl <= 0 ? 3 : Math.round(s.ivl * s.ease * 1.3); s.ease += 0.15; }
  }
  s.due = today() + s.ivl;
  state[c.id] = s;
  localStorage.setItem(KEY, JSON.stringify(state));
  idx++; render();
}
document.getElementById("deck").addEventListener("click", ()=>{
  if (idx < queue.length) document.getElementById("deck").classList.toggle("flipped");
});
document.querySelectorAll("#actions button").forEach(b =>
  b.addEventListener("click", ()=> grade(parseInt(b.dataset.g))));
document.addEventListener("keydown", e=>{
  if (e.code === "Space"){ e.preventDefault(); document.getElementById("deck").click(); }
  else if (e.key === "1") grade(0);
  else if (e.key === "2") grade(3);
  else if (e.key === "3") grade(4);
  else if (e.key === "4") grade(5);
  else if (e.key.toLowerCase() === "r"){ state = {}; localStorage.removeItem(KEY); buildQueue(); }
});
buildQueue();
</script>
